<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="Max Exner — Backend and ERP Developer, Germany">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#FBFCFD"/><stop offset="100%" stop-color="#F4F7FA"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8250DF" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0;-1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.09"/><stop offset="100%" stop-color="#0969DA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#E1E7EE" stroke-width="1"/>
    </pattern>
    <clipPath id="m0"><rect x="32" y="138" height="22" width="0"><animate attributeName="width" values="0;193;193;0;0" keyTimes="0;0.1;0.283;0.333;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="m1"><rect x="32" y="138" height="22" width="0"><animate attributeName="width" values="0;0;176;176;0;0" keyTimes="0;0.333;0.433;0.617;0.667;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="m2"><rect x="32" y="138" height="22" width="0"><animate attributeName="width" values="0;0;227;227;0" keyTimes="0;0.667;0.767;0.95;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="480" height="250" rx="14" fill="url(#bg)"/>
  <rect width="480" height="250" rx="14" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="400" cy="56" rx="150" ry="110" fill="url(#glow)"/>

  <g stroke="#A9B4C0" stroke-width="1.1" fill="none" opacity="0.7">
    <path d="M356 208 L400 190 L444 214"/><path d="M356 208 L392 232 L444 214"/><path d="M392 232 L400 190"/>
  </g>
  <g fill="#0969DA">
    <circle cx="356" cy="208" r="3.4"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="190" r="3.4" fill="#8250DF"><animate attributeName="opacity" values="1;0.35;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="444" cy="214" r="3.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="232" r="3.4" fill="#1A7F37"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="32" y="86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#1F2328" letter-spacing="1" textLength="248" lengthAdjust="spacingAndGlyphs">MAX EXNER</text>
  <rect x="32" y="104" width="248" height="2.5" rx="1.25" fill="#D8DEE4"/>
  <rect x="32" y="104" width="248" height="2.5" rx="1.25" fill="url(#rule)"/>

  <g clip-path="url(#m0)"><text x="32" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#59636E" textLength="193" lengthAdjust="spacingAndGlyphs">Backend &amp; ERP Developer</text></g>
  <g clip-path="url(#m1)"><text x="32" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#59636E" textLength="176" lengthAdjust="spacingAndGlyphs">C# · .NET · SQL · PHP</text></g>
  <g clip-path="url(#m2)"><text x="32" y="155" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#59636E" textLength="227" lengthAdjust="spacingAndGlyphs">Internal tools &amp; automation</text></g>
  <rect y="139" width="2" height="19" fill="#0969DA" x="32">
    <animate attributeName="x" values="32;225;225;32;32;208;208;32;32;259;259;32" keyTimes="0;0.1;0.283;0.333;0.333;0.433;0.617;0.667;0.667;0.767;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.48;0.5;0.98;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6E7781">
    <text x="32" y="196" textLength="60" lengthAdjust="spacingAndGlyphs">Germany</text>
    <circle cx="106" cy="192" r="1.8" fill="#C4CCD6"/>
    <text x="118" y="196" fill="#1A7F37" textLength="90" lengthAdjust="spacingAndGlyphs">open to work</text>
  </g>
</svg>
